# Publish a release of ml-dash from CI, not from a laptop.
#
# Everything that ships is built here, in one run, from a commit that is
# already on GitHub: eight compiled binaries, the npm tarball, both
# installers and the manifest that hashes all of them. The publish step then
# uploads exactly those bytes. That is the same contract scripts/
# build-release.ts and scripts/publish-release.sh already enforce locally —
# this workflow is the place it actually runs, so that no artifact anyone
# installs has to be taken on trust from a developer machine.
#
# One job on purpose. A build job handing ~700 MB of binaries to a publish
# job through the artifact store adds a large, slow moving part between the
# hash and the upload, and the hash check at the far end is what makes the
# split worth anything in the first place — publish-release.sh re-verifies
# every file against the manifest either way. So the credentials are simply
# never touched until `npm test` and the build have both passed.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.0 (must equal package.json)"
        required: true
        type: string
      ref:
        description: "Commit SHA, tag or branch to build (default: the ref this was dispatched on)"
        required: false
        type: string
      dry_run:
        description: "Build and check only — publish nothing, move no pointer"
        required: false
        default: false
        type: boolean
      release_only:
        description: "Only create the GitHub Release for a version already on npm and R2 — build nothing, publish nothing"
        required: false
        default: false
        type: boolean
  push:
    # A `v0.1.0` tag publishes 0.1.0. This cannot double-publish alongside a
    # manual dispatch of the same version: R2 objects and npm versions are
    # immutable, and publish-release.sh resumes only when the already-published
    # bytes are identical and fails loudly when they are not. A second run of
    # the same commit is therefore a no-op; a second run of a *different*
    # commit under the same version is refused rather than silently winning.
    # Deliberately a wide glob. Actions tag filters are globs, not regular
    # expressions — `v[0-9]+.[0-9]+.[0-9]+` matches a literal `+`, so it would
    # have fired for nothing at all. The narrowing happens in `Resolve version`
    # below, where a real semver regex can run and can report *why* a tag was
    # rejected instead of silently never triggering.
    tags:
      - "v*"

# Serialised per version, never cancelled: interrupting a run between the R2
# upload and the npm publish is exactly the half-finished state that takes a
# human to untangle.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

# Read-only by default; the job below asks for the two extra scopes it needs
# and nothing else.
permissions:
  contents: read

jobs:
  release:
    name: build · verify · publish
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release and upload its assets
      id-token: write      # npm provenance / trusted publishing via OIDC
    env:
      # Resolved once so every later step agrees, including the failure paths.
      VERSION: ${{ inputs.version || '' }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      # Recovery mode: the artifacts already exist and are immutable, so they
      # are fetched back and verified instead of rebuilt. Nothing is published.
      RELEASE_ONLY: ${{ inputs.release_only && 'true' || 'false' }}
      # Pinned: `npx wrangler` unpinned would let a wrangler release change how
      # a publish behaves without a commit here.
      ML_DASH_WRANGLER: wrangler@4.136.3
    steps:
      - name: Resolve version
        id: v
        run: |
          set -euo pipefail
          version="$VERSION"
          if [ -z "$version" ]; then
            # Tag push: the `v` prefix is peeled here rather than in an
            # expression — GitHub's expression language has no substring().
            version="${GITHUB_REF_NAME#v}"
          fi
          # Strict semver, because the tag trigger is a wide glob: `v1.2`,
          # `v1.2.3.4`, `vlatest` and `v01.2.3` all reach here and all must be
          # refused loudly rather than published as something surprising.
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' (from ${GITHUB_REF_NAME}) is not a valid semver version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version (dry_run=$DRY_RUN, release_only=$RELEASE_ONLY)"

      - uses: actions/checkout@v4
        with:
          # A dispatch may name an exact commit; a tag push builds the tag.
          # Either way the tree that ships is one that is already on GitHub and
          # can be reviewed after the fact — never a local working copy.
          ref: ${{ inputs.ref || github.sha }}
          # build-release.ts records `git rev-parse HEAD` in the manifest, so
          # the checkout must be a real repository, not a detached export.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          # Writes the .npmrc that `npm publish` reads NODE_AUTH_TOKEN from,
          # and is also what setup-node needs for the OIDC handshake.
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1, which Node 24 does not
      # necessarily ship yet. Pinned rather than `@latest` so the publish path
      # cannot change under us between two runs of the same commit.
      - name: Pin npm
        if: env.RELEASE_ONLY != 'true'
        run: npm install -g npm@11.12.1

      # The exact Bun the 0.1.0 artifacts were built with. `latest` would mean
      # a rebuild of the same commit produces different binaries, which makes
      # the immutability check in publish-release.sh fire on a re-run that
      # should have been a no-op.
      - uses: oven-sh/setup-bun@v2
        if: env.RELEASE_ONLY != 'true'
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        if: env.RELEASE_ONLY != 'true'
        run: npm ci

      # Before anything is built, let alone published. The Python interop
      # suites skip on a machine without the ml-dash virtualenv — they report
      # "skipped", not "passed", so this gate never turns unverified into green.
      - name: Test
        if: env.RELEASE_ONLY != 'true'
        run: npm test

      - name: Check the version being published is the one in the tree
        if: env.RELEASE_ONLY != 'true'
        run: |
          set -euo pipefail
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$pkg" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::package.json is $pkg but this run was asked to publish ${{ steps.v.outputs.version }}" >&2
            exit 1
          fi
          # build-release.ts additionally refuses to start when src/version.ts
          # disagrees with package.json, so the compiled binary cannot
          # misreport itself.

      - name: Build all eight targets, the npm tarball and the installers
        if: env.RELEASE_ONLY != 'true'
        run: bun run scripts/build-release.ts

      # Recovery path for a release whose GitHub Release step failed after npm
      # and R2 had already been written. Those bytes are immutable and a
      # rebuild cannot be trusted to reproduce them — `npm pack` includes
      # README.md, so any later commit touching the README yields a different
      # tarball, which is exactly what stopped run 35846188686. The published
      # release is fetched back and re-hashed against its own manifest, and
      # that manifest then flows into the same completeness check and the same
      # Release step the full pipeline uses.
      - name: Fetch the published release instead of building it
        if: env.RELEASE_ONLY == 'true'
        run: ./scripts/fetch-published-release.sh "${{ steps.v.outputs.version }}"

      # `bun build` exiting 0 is not proof eight files landed. The manifest is
      # what the publish step trusts, so it is what gets counted.
      - name: Check the manifest describes a complete release
        run: |
          set -euo pipefail
          node -e '
            const m = require("./release/${{ steps.v.outputs.version }}/manifest.json");
            const want = ["darwin-arm64","darwin-x64","linux-x64","linux-arm64",
                          "linux-x64-musl","linux-arm64-musl","windows-x64","windows-arm64"];
            const missing = want.filter((p) => !m.platforms[p]);
            if (missing.length) throw new Error("manifest is missing: " + missing.join(", "));
            if (Object.keys(m.platforms).length !== want.length) throw new Error("unexpected extra platforms");
            if (!m.npm?.tarball) throw new Error("manifest has no npm tarball");
            for (const n of ["install.sh", "install.ps1"]) if (!m.installers?.[n]) throw new Error("manifest has no " + n);
            if (m.commit.endsWith("-dirty")) throw new Error("built from a dirty tree in CI — that should be impossible");
            console.log(`${want.length} platforms, ${m.npm.tarball}, bun ${m.bun}, commit ${m.commit}`);
          '

      # Everything that can be known before a byte is written goes here. The
      # publish order is R2 first, npm second — a pointer must not move to
      # binaries nobody can fetch — which means an npm failure would otherwise
      # land *after* the bucket is written. That is the half-published state
      # this pipeline exists to avoid, so npm is interrogated first.
      #
      # `--precheck-npm` reads the registry over plain HTTP (a definite 404 is
      # the only thing treated as "no such package") and decides:
      #   * version already published, same bytes  → safe, the publish resumes
      #   * version already published, other bytes → stop
      #   * package exists, version is new         → needs NPM_TOKEN, or an
      #     explicit ML_DASH_NPM_TRUSTED=1 from someone who has read the
      #     package's settings page, because no endpoint reports whether a
      #     trusted publisher is configured
      #   * package does not exist                 → NPM_TOKEN required, no
      #     override: trusted publishing cannot be configured for a name that
      #     has never been published
      #   * new unscoped name whose punctuation-stripped form is taken → stop,
      #     npm would answer E403 "too similar"
      - name: Check R2 credentials and npm feasibility, before anything is uploaded
        if: env.DRY_RUN != 'true' && env.RELEASE_ONLY != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ML_DASH_NPM_TRUSTED: ${{ vars.ML_DASH_NPM_TRUSTED }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — see docs/RELEASE.md" >&2
            exit 1
          fi
          echo "R2 credentials present."
          ./scripts/publish-release.sh "${{ steps.v.outputs.version }}" --precheck-npm

      # npm authentication, in the order of preference the registry supports:
      #
      #  * Trusted publishing (OIDC). No secret at all — the registry verifies
      #    this workflow's identity. It can only be configured on a package
      #    that already exists, so it is unavailable for the first publish of
      #    a name (npm/cli#8544).
      #  * NPM_TOKEN, with --provenance so the published tarball still carries
      #    a signed statement of which commit and workflow produced it.
      #
      # Whichever is in play, the *tarball* is the one built above and hashed
      # into the manifest; publish-release.sh publishes it by path.
      - name: Publish to R2 and npm
        if: env.DRY_RUN != 'true' && env.RELEASE_ONLY != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Unset when NPM_TOKEN is absent, which is how npm decides to fall
          # back to the OIDC handshake.
          ML_DASH_NPM_PROVENANCE: ${{ secrets.NPM_TOKEN != '' && '1' || '' }}
          ML_DASH_NPM_TRUSTED: ${{ vars.ML_DASH_NPM_TRUSTED }}
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "npm auth: NPM_TOKEN + --provenance"
          else
            echo "npm auth: trusted publishing (OIDC)"
          fi
          # `latest` moves; `stable` deliberately does not. A first release of
          # a platform matrix this machine cannot fully execute should be
          # reachable by a pinned install before it becomes the default.
          ./scripts/publish-release.sh "${{ steps.v.outputs.version }}"

      # Only after R2 read back clean and npm accepted the tarball. A Release
      # is an announcement; announcing a publish that did not happen is the
      # failure mode this whole pipeline is shaped against.
      #
      # Same bytes as R2, under names that say what they are — `ml-dash` eight
      # times over would be unusable as release assets. manifest.json ships
      # too, so an asset downloaded from here can be checked against the same
      # sha256 an installer would check.
      - name: Publish the GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          rel="release/$V"
          staged="$(mktemp -d)"
          notes="$(mktemp)"
          trap 'rm -rf "$staged" "$notes"' EXIT

          # Every name comes out of the manifest. The npm name is expected to
          # change to a scoped one (`ml-dash` is not claimable unscoped), and a
          # literal here would then label the assets after a package that is
          # not the one being published.
          eval "$(node -e '
            const m = require(`./release/${process.env.V}/manifest.json`);
            const base = m.name.replace(/^@[^/]+\//, "");
            const bins = Object.entries(m.platforms)
              .map(([p, e]) => `${p}:${e.binary}`).join(" ");
            console.log(`PKG_NAME=${JSON.stringify(m.name)}`);
            console.log(`PKG_BASE=${JSON.stringify(base)}`);
            console.log(`TARBALL=${JSON.stringify(m.npm.tarball)}`);
            console.log(`BINS=${JSON.stringify(bins)}`);
            console.log(`SRC_COMMIT=${JSON.stringify(m.commit)}`);
          ')"

          cp "$rel/manifest.json" "$rel/install.sh" "$rel/install.ps1" "$rel/$TARBALL" "$staged/"
          for entry in $BINS; do
            platform="${entry%%:*}"; binary="${entry#*:}"
            case "$binary" in
              *.exe) cp "$rel/$platform/$binary" "$staged/$PKG_BASE-$V-$platform.exe" ;;
              *)     cp "$rel/$platform/$binary" "$staged/$PKG_BASE-$V-$platform" ;;
            esac
          done

          {
            echo "$PKG_NAME $V"
            echo
            echo "Install:"
            echo '```sh'
            echo "curl -fsSL https://pub-42e1dcc7de574d4a92984865fdc95f10.r2.dev/install.sh | sh"
            echo "npm install -g $PKG_NAME@$V"
            echo '```'
            echo
            echo "Every asset here is byte-identical to the one served from R2 and to the"
            echo "sha256 recorded in \`manifest.json\`."
            echo
            echo "Built from \`$SRC_COMMIT\`, which is the commit \`manifest.json\` records"
            echo "and the commit \`v$V\` tags."
          } > "$notes"

          # The tag is made with git, before the Release exists, and points at
          # the manifest's commit — the one the published bytes were built
          # from, which on a resumed release is *not* this run's checkout.
          #
          # It is deliberately not `gh release create --target "$SRC_COMMIT"`.
          # That asks the releases API to resolve a commit, and the API then
          # refuses when the resolved commit's `.github/workflows/` differs
          # from the default branch's, because creating that release would
          # amount to changing workflow files — a permission GITHUB_TOKEN
          # cannot be granted at all. v0.1.1 hit exactly that: the artifacts
          # were built from 41ece18, and the only later commit on main,
          # 4f45e92, edited this file. Runs 35839740311 and 35839865703 both
          # answered `403 Resource not accessible by integration` while the
          # job log showed `Contents: write` granted. `contents: write` is not
          # the missing piece and no organization setting is either.
          #
          # Creating the tag over git is not subject to that rule — it adds no
          # workflow content, it points at a commit GitHub already has — and
          # once the tag exists `gh release create` needs no target, so the
          # API never resolves one.
          existing="$(git ls-remote origin "refs/tags/v$V^{}" | cut -f1)"
          [ -n "$existing" ] || existing="$(git ls-remote origin "refs/tags/v$V" | cut -f1)"

          if [ -z "$existing" ]; then
            # The checkout is depth-1 on the dispatched ref, which on a
            # resumed release does not contain the manifest's commit.
            git cat-file -e "$SRC_COMMIT^{commit}" 2>/dev/null ||
              git fetch --no-tags --depth=1 origin "$SRC_COMMIT"
            git tag "v$V" "$SRC_COMMIT"
            git push origin "v$V"
            echo "  ✓ tagged v$V at $SRC_COMMIT"
          elif [ "$existing" = "$SRC_COMMIT" ]; then
            echo "  ✓ v$V already tags $SRC_COMMIT"
          else
            echo "::error::v$V already exists at $existing, but $V was built from $SRC_COMMIT." >&2
            echo "Tags that installs and release notes point at are not moved by this pipeline." >&2
            exit 1
          fi

          # Re-runnable: a Release left behind by a failed earlier attempt gets
          # its assets replaced rather than blocking the run.
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "$staged"/* --clobber
          else
            gh release create "v$V" "$staged"/* --title "v$V" --notes-file "$notes"
          fi

      # Small enough to keep on every run, dry or not: the manifest is the
      # record of what a run produced, and on a dry run it is the only output.
      - name: Keep the manifest and installers with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.v.outputs.version }}-manifest
          # The tarball rides along at 55 KB: it is the exact npm payload, and
          # having it attached to the run is what lets a packed artifact be
          # compared against another build without re-running the pipeline.
          # The 700 MB of binaries deliberately do not — they go to R2 and to
          # the Release.
          path: |
            release/${{ steps.v.outputs.version }}/manifest.json
            release/${{ steps.v.outputs.version }}/install.sh
            release/${{ steps.v.outputs.version }}/install.ps1
            release/${{ steps.v.outputs.version }}/*.tgz
          if-no-files-found: warn
